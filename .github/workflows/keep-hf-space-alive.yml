name: Keep Hugging Face Space Warm

on:
  schedule:
    # Every 5 minutes (GitHub Actions' minimum). Free HF CPU Spaces sleep after
    # inactivity; a periodic request resets that idle timer so the Space stays
    # warm between visitors. (GitHub's scheduler is best-effort and can be
    # delayed, so the client-side warm-up on page load is the primary defense.)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Career Conversation Space
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            https://abhati27-career-conversation-anmol.hf.space/ || true
