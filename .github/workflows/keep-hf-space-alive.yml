name: Keep Hugging Face Space Warm

on:
  schedule:
    # Free HF CPU Spaces are paused after ~48 hours of inactivity. A request
    # resets that idle timer, so we ping twice a day (00:00 and 12:00 UTC). Two
    # pings/day leaves a wide safety margin: even if GitHub's scheduler delays or
    # skips one run (it's best-effort), the Space still gets hit well within 48h.
    # (The client-side warm-up on page load handles per-visit warmth separately.)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Career Conversation Space
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            https://abhati27-career-conversation-anmol.hf.space/ || true
