name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # Monthly keepalive heartbeat commits must not trigger a rebuild.
      - '.github/keepalive-heartbeat.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          # PostHog key is injected from a GitHub Actions Secret at build time,
          # so it never lives in the repo source. Add it under:
          # Settings → Secrets and variables → Actions → Secrets → New repository secret
          #   name: NEXT_PUBLIC_POSTHOG_KEY   value: your phc_... key
          # If the secret is absent, the build still succeeds with analytics off.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: 'https://us.i.posthog.com'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

